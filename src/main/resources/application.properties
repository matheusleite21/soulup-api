spring.application.name=soulup-api

# Banco Oracle da FIAP, no mesmo esquema usado em Building Relational Database e em Python.
# Usuario e senha vem de variaveis de ambiente para nao ficarem gravados no GitHub.
#onde esta o o banco de dados
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//oracle.fiap.com.br:1521/ORCL}

#onde esta o driver do JDBC
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver

#quem e o usuario e a senha
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Poucas conexoes abertas ao mesmo tempo no Oracle compartilhado da FIAP
spring.datasource.hikari.maximum-pool-size=3

#JPA/Hibernate
# none: as tabelas ja existem (script DDL da Sprint 3 de Database e complementos da Sprint 4).
# A API nao cria nem altera tabelas, apenas le e grava os dados.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

#habilitar a exibicao do SQL no terminal
spring.jpa.show-sql=true

#Formatando o SQL no terminal
spring.jpa.properties.hibernate.format_sql=true

# Mensagens de erro devolvidas ao front-end (ex.: "Usuario nao encontrado com o ID 99")
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false

# Render informa a porta pela variavel PORT; localmente a API sobe na 8081
server.port=${PORT:8081}
